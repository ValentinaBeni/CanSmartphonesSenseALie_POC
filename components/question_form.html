<div>
	<form id="formField">
		<div class="question-display">
			<p id="questionText">Caricamento domanda in corso...</p>
		</div>

		<div class="answer-input-area">
			<label for="formField">La tua risposta:</label>
			<div class="answer-input-wrapper">
				<input type="text" id="inputField" name="answer" placeholder="Digita la tua risposta" autocomplete="off"
					spellcheck="false">
				<button type="button" id="buttonSubmitAnswer">Invia</button>
			</div>
		</div>

		<div class="progress-bar-container">
			<div class="progress-bar">
				<div id="progressFill" class="progress-fill"></div>
			</div>
			<span id="progressText" class="progress-text">0%</span>
		</div>

		<div class="question-counter">
			<span id="questionCounter">Domanda 0 di 18</span>
		</div>
	</form>
</div>
